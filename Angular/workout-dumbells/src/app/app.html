<header class="bg-slate-900/95 backdrop-blur-md sticky top-0 z-40 border-b border-slate-800">
  <div class="px-4 py-4 max-w-md mx-auto">
    <div class="flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-tight text-white">Protocol</h1>
      <button (click)="resetCurrentDay()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-800 text-slate-400 hover:text-white transition-colors">
        <i class="fas fa-rotate-right text-sm"></i>
      </button>
    </div>
  </div>
</header>

<main class="p-4 max-w-md mx-auto">
  <div *ngFor="let day of [1, 2, 3, 4]" [class.active]="activeDay == day.toString()" class="tab-content">
    <h2 class="text-sm font-semibold text-emerald-400 uppercase tracking-widest mb-4">
      Day {{day}} &bull; {{ day % 2 !== 0 ? 'Upper' : 'Lower' }} Body
    </h2>
    
    <div class="exercise-list space-y-3">
      <label *ngFor="let ex of workouts[day]; let i = index" 
             class="flex items-center gap-3 bg-slate-800 p-2.5 rounded-2xl border border-slate-700/50 cursor-pointer shadow-sm">
        
        <img [src]="getImgUrl(ex)" [alt]="ex.name" 
             (click)="openModal(getImgUrl(ex), ex.name)"
             class="w-14 h-14 rounded-xl object-cover bg-slate-900 border border-slate-600 flex-shrink-0 cursor-pointer hover:scale-105 transition">
        
        <div class="flex-1 min-w-0">
          <h4 class="font-semibold text-sm text-slate-100 truncate">{{ex.name}}</h4>
          <div class="flex gap-1.5">
            <span class="bg-slate-900 text-slate-300 text-[9px] font-bold px-2 py-1 rounded border border-slate-700">{{ex.sets}} Sets</span>
            <span class="bg-slate-900 text-slate-300 text-[9px] font-bold px-2 py-1 rounded border border-slate-700">{{ex.reps}}</span>
          </div>
        </div>

        <div class="pr-1">
          <input type="checkbox" 
                 [checked]="isCompleted(day.toString(), i)" 
                 (change)="onCheckboxChange(day.toString(), i, $event)"
                 class="hidden">
          <div [class.bg-emerald-500]="isCompleted(day.toString(), i)"
               class="w-8 h-8 rounded-full border-[2.5px] border-slate-500 flex items-center justify-center bg-slate-900/50">
            <svg class="w-5 h-5 text-white" [class.opacity-100]="isCompleted(day.toString(), i)" [class.opacity-0]="!isCompleted(day.toString(), i)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
        </div>
      </label>
    </div>
  </div>
</main>

<nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 z-50 pb-[env(safe-area-inset-bottom)]">
  <div class="max-w-md mx-auto flex justify-between px-2 py-1">
    <button *ngFor="let d of [1, 2, 3, 4]" 
            (click)="switchTab(d.toString())" 
            [class.text-emerald-400]="activeDay == d.toString()"
            class="flex-1 flex flex-col items-center justify-center p-2 text-slate-500 transition-colors">
      <div [class.bg-emerald-500/15]="activeDay == d.toString()" class="w-10 h-8 flex items-center justify-center rounded-full mb-1 transition-colors">
        <i class="fas" [class.fa-dumbbell]="d%2 !== 0" [class.fa-shoe-prints]="d%2 == 0"></i>
      </div>
      <span class="text-[10px] font-medium">Day {{d}}</span>
    </button>
  </div>
</nav>

<div *ngIf="showModal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-[999] p-4" (click)="closeModal()">
  <button class="absolute top-4 right-4 text-white text-3xl">&times;</button>
  <img [src]="selectedImageUrl" [alt]="selectedExerciseName" class="max-w-full max-h-[80vh] rounded-xl shadow-2xl object-contain">
</div>
